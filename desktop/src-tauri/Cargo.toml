[package]
name = "vimmer-desktop"
description = "Vimmer Studio: desktop shell for the video editor"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: keeps this crate out of the rust-core workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Already in the lockfile through vimmer-media; used directly for image sizes.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
vimmer-check = { version = "0.1.0", path = "../../rust-core/crates/vimmer-check" }
vimmer-dsl = { version = "0.1.0", path = "../../rust-core/crates/vimmer-dsl" }
vimmer-media = { version = "0.1.0", path = "../../rust-core/crates/vimmer-media" }
vimmer-scheduler = { version = "0.1.0", path = "../../rust-core/crates/vimmer-scheduler" }
vimmer-storyboard = { version = "0.1.0", path = "../../rust-core/crates/vimmer-storyboard" }
