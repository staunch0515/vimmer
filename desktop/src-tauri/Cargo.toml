[package]
name = "vimmer-desktop"
description = "Vimmer Studio: desktop shell for the video editor"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone: keeps this crate out of the rust-core workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
vimmer-dsl = { version = "0.1.0", path = "../../rust-core/crates/vimmer-dsl" }
vimmer-media = { version = "0.1.0", path = "../../rust-core/crates/vimmer-media" }
vimmer-scheduler = { version = "0.1.0", path = "../../rust-core/crates/vimmer-scheduler" }
