[workspace]
resolver = "2"
members = [
    "crates/vimmer-dsl",
    "crates/vimmer-media",
    "crates/vimmer-scheduler",
    "crates/vimmer-cli",
    "crates/vimmer-storyboard",
    "crates/vimmer-check",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "sync", "time"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
clap = { version = "4", features = ["derive"] }
vimmer-dsl = { path = "crates/vimmer-dsl" }
vimmer-media = { path = "crates/vimmer-media" }
vimmer-scheduler = { path = "crates/vimmer-scheduler" }
