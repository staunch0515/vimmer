[package]
name = "vimmer-check"
description = "Rule-based quality check of a timeline (and optionally its render): no AI, no network"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
image.workspace = true
# Brand font advance widths (cmap + hmtx); no default features, no dependencies of its own.
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
vimmer-dsl.workspace = true
vimmer-media.workspace = true
