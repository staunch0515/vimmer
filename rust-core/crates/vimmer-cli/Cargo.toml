[package]
name = "vimmer-cli"
description = "Command-line entry point: render a timeline JSON to MP4, or generate one from text with Claude"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vimmer"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
vimmer-check = { path = "../vimmer-check" }
vimmer-dsl.workspace = true
vimmer-media.workspace = true
vimmer-scheduler.workspace = true
vimmer-storyboard = { path = "../vimmer-storyboard" }
